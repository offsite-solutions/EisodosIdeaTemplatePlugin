# IntelliJ Platform
# PS = PhpStorm. The IDEA Community (IC) distribution is no longer published after 2025.2,
# and PhpStorm is the target IDE for this plugin anyway.
# We build against 2026.1.x because it is the last platform line that still targets Java 21.
# PhpStorm 2026.2 requires Java 25, and compiling against it would raise the minimum
# supported IDE to 2026.2. Compatibility with 2026.2.x is proven by the Plugin Verifier
# (see pluginVerifierIdeVersions below) rather than by compiling against it.
platformType=PS
platformVersion=2026.1.5

# Plugin
pluginGroup=com.eisodos.intellij
pluginName=Eisodos Template Support
pluginVersion=1.1.0
pluginSinceBuild=242
pluginUntilBuild=263.*

# IDEs the JetBrains Plugin Verifier runs against (lower and upper bound of the
# declared since/until range). Comma separated PhpStorm versions.
pluginVerifierIdeVersions=2024.2,2026.3

# Kotlin
kotlin.stdlib.default.dependency=false

# Gradle
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# JDK path for toolchain resolution (adjust if your JDK 21 is elsewhere)
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
